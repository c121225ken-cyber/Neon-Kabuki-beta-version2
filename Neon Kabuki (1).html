<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neon Kabuki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage, HUD pinned to corners (floor/HP left, viewers/rank right), comment feed along the right edge. Single neon look by choice. */
:root{
  --bg:#07060d;
  --fg:#f1ecff;
  --dim:#9a93b8;
  --magenta:#ff2e88;
  --cyan:#27e6ff;
  --gold:#ffd23f;
  --panel:rgba(14,10,28,.72);
  --line:rgba(160,140,255,.28);
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --font-num:'Chakra Petch','Zen Kaku Gothic New',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;margin:0;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
#app{position:relative;height:100%;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));width:min(46vw,320px)}
.tr{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.nm{font-family:var(--font-display);font-size:18px;letter-spacing:.04em}
.nm small{font-family:var(--font-num);font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:.14em}
.bar{height:10px;background:rgba(255,255,255,.1);border:1px solid var(--line);margin-top:6px;transform:skewX(-18deg);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),#7affc8);transition:width .15s}
#floor{font-family:var(--font-num);font-weight:700;font-size:22px;letter-spacing:.12em;margin-top:10px;font-variant-numeric:tabular-nums}
#floor small{font-size:11px;color:var(--dim);letter-spacing:.18em;margin-left:6px;font-weight:500}
#area{font-size:12px;color:var(--cyan);letter-spacing:.14em;margin-top:2px}
.tower{height:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.tower i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s}
.viewers{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);background:var(--panel);padding:5px 10px;border:1px solid var(--line)}
.live{background:var(--magenta);color:#fff;font-family:var(--font-num);font-weight:700;font-size:11px;padding:1px 6px;letter-spacing:.12em;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
#viewers{font-family:var(--font-num);font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
.rankwrap{display:flex;align-items:center;gap:10px}
.rankcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.meter{width:min(24vw,120px);height:8px;background:rgba(255,255,255,.1);border:1px solid var(--line);transform:skewX(-18deg);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--magenta);transition:width .12s}
#rlabel{font-size:11px;letter-spacing:.2em;color:var(--dim)}
#rank{font-family:var(--font-display);font-size:60px;line-height:1;min-width:1.2ch;text-align:right;color:var(--dim);text-shadow:0 0 18px currentColor;transition:transform .15s}
#rank.pop{transform:scale(1.35)}
#rank[data-r="C"],#rank[data-r="B"]{color:var(--cyan)}
#rank[data-r="A"]{color:var(--gold)}
#rank[data-r="S"],#rank[data-r="SS"]{color:var(--magenta)}
#rank[data-r="SSS"]{color:#fff;text-shadow:0 0 10px var(--magenta),0 0 28px var(--cyan)}
#comments{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:158px;bottom:200px;width:min(42vw,270px);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
#comments p{margin:0;font-size:13px;line-height:1.4;background:var(--panel);padding:4px 8px;border-left:2px solid var(--dim);animation:cin .25s ease-out;overflow-wrap:anywhere;transition:opacity .6s}
#comments p b{color:var(--dim);font-weight:500;margin-right:6px;font-size:11px}
#comments p[data-r="1"],#comments p[data-r="2"]{border-left-color:var(--cyan)}
#comments p[data-r="3"]{border-left-color:var(--gold)}
#comments p[data-r="4"],#comments p[data-r="5"]{border-left-color:var(--magenta);font-size:14px}
#comments p[data-r="6"]{border-left-color:#fff;background:linear-gradient(90deg,rgba(255,46,136,.55),rgba(39,230,255,.4));font-weight:700;font-size:15px}
#comments p.sc{background:linear-gradient(90deg,var(--gold),#ff9a3c);color:#1a1020;font-weight:700;border-left-color:#fff}
#comments p.sc b{color:#4a2a10}
#comments p.out{opacity:0}
@keyframes cin{from{transform:translateX(24px);opacity:0}}
#combo{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:122px;font-family:var(--font-num);font-weight:700;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,210,63,.6)}
#combo small{font-size:13px;letter-spacing:.2em;margin-left:6px;color:var(--fg)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--font-display);font-size:clamp(32px,8vw,76px);letter-spacing:.06em;opacity:0;text-shadow:0 0 24px var(--magenta)}
#banner small{display:block;font-family:var(--font-body);font-size:clamp(13px,2.4vw,20px);color:var(--cyan);letter-spacing:.3em;text-shadow:none;margin-top:6px}
#banner.show{animation:ban 1.9s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#boss{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(60vw,460px);display:none}
#boss.on{display:block}
#boss span{font-family:var(--font-num);font-size:11px;letter-spacing:.2em;color:var(--gold)}
#boss .bar i{background:linear-gradient(90deg,var(--gold),var(--magenta))}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#flash.jd{opacity:1;transition:none;background:radial-gradient(circle,transparent 30%,rgba(39,230,255,.5));mix-blend-mode:screen}
#flash.hurt{opacity:1;transition:none;background:radial-gradient(circle,transparent 35%,rgba(255,40,70,.6))}
#screen,#pause,#reward{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(40,16,70,.88),rgba(5,4,12,.97));overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px));touch-action:pan-y}
#screen[hidden],#pause[hidden],#reward[hidden]{display:none}
.card{max-width:680px;width:100%;margin:auto;display:flex;flex-direction:column;gap:18px}
.card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,11vw,84px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance;background:linear-gradient(100deg,var(--cyan),#fff 45%,var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{font-family:var(--font-num);letter-spacing:.28em;font-size:12px;color:var(--dim)}
.card p{margin:0;line-height:1.7;color:var(--fg);font-size:15px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:center}
.keys kbd{font-family:var(--font-num);font-size:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:2px 8px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stats div{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.stats b{display:block;font-family:var(--font-num);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--dim);letter-spacing:.12em}
.btns{display:flex;flex-wrap:wrap;gap:12px}
button.go{pointer-events:auto;font-family:var(--font-display);font-size:20px;letter-spacing:.08em;color:#fff;background:var(--magenta);border:0;padding:14px 26px;cursor:pointer;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
button.go.alt{background:#3a2d6a}
button.go:hover{background:#ff5aa2}
button.go.alt:hover{background:#4d3d8a}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#touch{display:none}
@media (pointer:coarse){
  #touch{display:block}
  #comments{bottom:240px;top:190px;width:46vw}
  .keys.pc{display:none}
  #boss{bottom:auto;top:92px}
}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:2px solid var(--line);background:rgba(20,14,40,.45);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(39,230,255,.35);border:2px solid var(--cyan)}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:rgba(20,14,40,.55);color:var(--fg);font-family:var(--font-display);font-size:20px;display:flex;align-items:center;justify-content:center}
.tb.on{background:rgba(255,46,136,.5)}
.sbar{height:6px;margin-top:5px}
#perks{font-size:11px;color:var(--gold);margin-top:4px;max-width:260px;line-height:1.4}
#reward .btns button{text-align:left;font-size:16px;letter-spacing:.03em}
.sbar i{background:linear-gradient(90deg,#ff9a3c,#ffd23f);width:0}
#stl{font-family:var(--font-num);font-size:11px;letter-spacing:.14em;color:var(--gold);margin-top:3px}
#aura{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 55%,transparent 42%,rgba(255,46,136,.32) 80%,rgba(255,210,63,.42));mix-blend-mode:screen}
#aura.on{opacity:1;animation:auraP 1.1s infinite alternate}
@keyframes auraP{from{filter:brightness(.8)}to{filter:brightness(1.3)}}
#screen.sel{background:linear-gradient(180deg,rgba(5,4,12,.6),rgba(5,4,12,0) 22%,rgba(5,4,12,0) 46%,rgba(5,4,12,.9) 72%);align-items:flex-end}
#screen.sel .card{max-width:960px;gap:12px;margin:auto auto 0}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chc{pointer-events:auto;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:box-shadow .2s,border-color .2s}
.chc[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 28px -6px var(--c)}
.chc b{font-family:var(--font-display);font-size:28px;font-weight:400;line-height:1.1}
.chc small{font-family:var(--font-num);letter-spacing:.24em;color:var(--dim);font-size:11px}
.chc .role{color:var(--c);font-size:13px}
.chc p{font-size:13px;line-height:1.6;margin:0;color:var(--fg)}
.st{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;font-size:11px;color:var(--dim);align-items:center;margin-top:2px}
.st i{display:block;height:5px;background:var(--c);transform:skewX(-18deg)}
@media (max-width:560px){.chs{grid-template-columns:1fr 1fr;gap:8px}.chc p{display:none}.chc b{font-size:22px}.chc .role{font-size:11px}}
#pause label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim)}
#pause input[type=range]{width:100%;accent-color:var(--magenta)}
@media (prefers-reduced-motion:reduce){.live{animation:none;}#aura.on{animation:none}#banner.show{animation-duration:.01s;opacity:1}}
</style>

<div id="app">
  <div id="hud">
    <div class="tl">

      <div class="tb" data-k="atk" style="right:max(96px,calc(env(safe-area-inset-right,0px) + 80px));bottom:max(32px,env(safe-area-inset-bottom,0px))">斬</div>
      <div class="tb" data-k="gun" style="right:max(18px,env(safe-area-inset-right,0px));bottom:max(88px,calc(env(safe-area-inset-bottom,0px) + 64px))">撃</div>
      <div class="tb" data-k="jump" style="right:max(18px,env(safe-area-inset-right,0px));bottom:max(160px,calc(env(safe-area-inset-bottom,0px) + 136px))">跳</div>
      <div class="tb" data-k="dodge" style="right:max(96px,calc(env(safe-area-inset-right,0px) + 80px));bottom:max(104px,calc(env(safe-area-inset-bottom,0px) + 100px))">避</div>
      <div class="tb" data-k="rise" style="right:max(174px,calc(env(safe-area-inset-right,0px) + 158px));bottom:max(60px,calc(env(safe-area-inset-bottom,0px) + 44px))">昇</div>
      <div class="tb" data-k="awk" style="right:max(174px,calc(env(safe-area-inset-right,0px) + 158px));bottom:max(132px,calc(env(safe-area-inset-bottom,0px) + 116px))">覚</div>
      <div class="tb" data-k="lock" style="right:max(96px,calc(env(safe-area-inset-right,0px) + 80px));bottom:max(190px,calc(env(safe-area-inset-bottom,0px) + 176px));width:50px;height:50px;font-size:12px">狙</div>
      <div class="tb" data-k="pose" style="right:max(18px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:56px;height:56px;font-size:15px">見得</div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="aura"></div>
  <div id="screen">
    <div class="card" id="card"></div>
  </div>
  <div id="reward" hidden><div class="card" id="rcard"></div></div>
  <div id="pause" hidden><div class="card"><h1 style="font-size:clamp(32px,8vw,56px)">PAUSE</h1><label>BGM音量<input id="vbgm" type="range" min="0" max="100"></label><label>効果音の音量<input id="vse" type="range" min="0" max="100"></label><div class="btns" style="margin-bottom:8px"><button class="go alt" id="pgfx" type="button">画質</button></div><div class="btns"><button class="go" id="presume" type="button">再開</button><button class="go alt" id="ptitle" type="button">セーブしてタイトルへ</button></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const screenEl=$('screen'),card=$('card');
if(!window.THREE){card.innerHTML='<h1>読み込み失敗</h1><p>3Dライブラリを読み込めませんでした。ページを再読み込みしてください。</p>';return;}
const T=THREE,PI=Math.PI,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0];
const angDiff=(a,b)=>((a-b+PI)%(2*PI)+2*PI)%(2*PI)-PI;
const ease=k=>k*k*(3-2*k),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let seVol=store.get('nk_se',1),bgmVol=store.get('nk_bgm',1);
const best=store.get('nk_best',{floor:0,score:0});

/* ================= renderer / scene ================= */
const app=$('app');
const renderer=new T.WebGLRenderer({antialias:true});
const GFX={q:store.get('nk_gfx',1)?1:0,auto:true,ema:16,n:0,chk:0}; // q=1: PS2-style (shadows + glow), q=0: light
renderer.setPixelRatio(Math.min(devicePixelRatio||1,GFX.q?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
app.insertBefore(renderer.domElement,app.firstChild);
const scene=new T.Scene();
scene.background=new T.Color(0x07060d);
scene.fog=new T.Fog(0x07060d,30,150);
const camera=new T.PerspectiveCamera(50,1,.1,420);
let post=null;
function resize(){const w=app.clientWidth||innerWidth,h=app.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(post)post.resize();}
addEventListener('resize',resize);resize();

const mat=(c,e=0,ei=1,extra={})=>new T.MeshStandardMaterial(Object.assign({color:c,emissive:e,emissiveIntensity:ei,roughness:.55,metalness:.35},extra));
scene.add(new T.AmbientLight(0x7a6ab0,.8));
const sun=new T.DirectionalLight(0xffffff,1.05);sun.position.set(9.6,22.4,12.8);scene.add(sun);
sun.castShadow=!!GFX.q;sun.shadow.mapSize.set(2048,2048);
{const c=sun.shadow.camera;c.left=-27;c.right=27;c.top=27;c.bottom=-27;c.near=1;c.far=70;c.updateProjectionMatrix();}
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(new T.HemisphereLight(0x9a8cff,0x1a0f30,.55));const rim=new T.DirectionalLight(0x8fb8ff,.55);rim.position.set(-8,6,-10);scene.add(rim);
const pl1=new T.PointLight(0xff2e88,1.3,60);pl1.position.set(-16,8,-10);scene.add(pl1);
const pl2=new T.PointLight(0x27e6ff,1.3,60);pl2.position.set(16,8,10);scene.add(pl2);

/* ---- procedural textures: everything is painted on canvases at load time ---- */
const srnd=s=>()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
const gx={
  cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;},
  tex(c,rx=1,ry=1){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);try{t.anisotropy=renderer.capabilities.getMaxAnisotropy();}catch(e){}return t;}
};
// scale the UVs of a box so a texture keeps its world size on every face (tu x tv world units per tile)
function boxUV(g,w,h,d,tu,tv,ou=0,ov=0){
  const a=g.attributes.uv.array,sc=[[d/tu,h/tv],[d/tu,h/tv],[w/tu,d/tv],[w/tu,d/tv],[w/tu,h/tv],[w/tu,h/tv]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){const j=(f*4+i)*2;a[j]=a[j]*sc[f][0]+ou;a[j+1]=a[j+1]*sc[f][1]+ov;}
  return g;
}
function paintPetals(ctx,cx,cy,r0,r1,n,rot,fill,stroke,lw){
  for(let i=0;i<n;i++){
    const a=rot+i/n*6.2832,w=(r1-r0)*.34;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(r0,0);ctx.quadraticCurveTo((r0+r1)/2,-w,r1,0);ctx.quadraticCurveTo((r0+r1)/2,w,r0,0);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
    ctx.restore();
  }
}
// stage floor: riveted steel panels, hazard ring, chrysanthemum crest. Returns [diffuse, emissive(neon lines)].
function makeFloorTex(){
  const S=1024,k=S/44,C=S/2,R=srnd(11),tile=S/16;

  for(let i=0;i<90;i++)sector(19.9,20.9,i/90*6.2832,(i+1)/90*6.2832,i%2?'#a37612':'#0a0816');
  const ring=(ctx,r,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(C,C,r*k,0,6.2832);ctx.stroke();};
  ring(a,21.6,11,'#05040c');ring(b,21.6,5,'#fff');
  ring(a,19.3,6,'#05040c');ring(b,19.3,2.5,'rgba(255,255,255,.85)');

  for(let i=0;i<72;i++){const t=i/72*6.2832,c=Math.cos(t),s=Math.sin(t);b.strokeStyle='rgba(255,255,255,.5)';b.lineWidth=2;b.beginPath();b.moveTo(C+c*18.5*k,C+s*18.5*k);b.lineTo(C+c*18.95*k,C+s*18.95*k);b.stroke();}

    a.strokeStyle='#05040c';a.lineWidth=5;a.beginPath();a.moveTo(C+c*6.4*k,C+s*6.4*k);a.lineTo(C+c*12*k,C+s*12*k);a.stroke();

/* ---- glow (bloom) post-process: scene -> bright pass -> blur at 1/4 and 1/8 size -> composite ---- */
function makePost(){
  try{
    if(!(T.WebGLRenderTarget&&T.ShaderMaterial&&T.OrthographicCamera&&renderer.getDrawingBufferSize))return null;
    const gl2=!!(renderer.capabilities&&renderer.capabilities.isWebGL2);
    const lin={minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,depthBuffer:false,stencilBuffer:false};
    const rt=(ms)=>ms&&gl2&&T.WebGLMultisampleRenderTarget?new T.WebGLMultisampleRenderTarget(8,8,Object.assign({},lin,{depthBuffer:true})):new T.WebGLRenderTarget(8,8,ms?Object.assign({},lin,{depthBuffer:true}):lin);
    const P={sc:rt(true),a1:rt(false),a2:rt(false),c1:rt(false),c2:rt(false)};
    const qs=new T.Scene(),qc=new T.OrthographicCamera(-1,1,1,-1,0,1),quad=new T.Mesh(new T.PlaneGeometry(2,2),null);quad.frustumCulled=false;qs.add(quad);
    const vs='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
    const sm=(fs,u)=>new T.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:fs,depthTest:false,depthWrite:false});
    const U=v=>({value:v});
    const mBright=sm('uniform sampler2D tDiffuse;uniform float thr;varying vec2 vUv;void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=max(c.r,max(c.g,c.b));float k=smoothstep(thr,thr+.3,l);gl_FragColor=vec4(c*k,1.);}',{tDiffuse:U(null),thr:U(.72)});
    const mBlur=sm('uniform sampler2D tDiffuse;uniform vec2 dir;varying vec2 vUv;void main(){vec3 s=texture2D(tDiffuse,vUv).rgb*.227027;s+=texture2D(tDiffuse,vUv+dir*1.384615).rgb*.316216;s+=texture2D(tDiffuse,vUv-dir*1.384615).rgb*.316216;s+=texture2D(tDiffuse,vUv+dir*3.230769).rgb*.070270;s+=texture2D(tDiffuse,vUv-dir*3.230769).rgb*.070270;gl_FragColor=vec4(s,1.);}',{tDiffuse:U(null),dir:U(new T.Vector2(0,0))});
    const mComp=sm('uniform sampler2D tScene;uniform sampler2D tB1;uniform sampler2D tB2;uniform float bloom;uniform vec2 res;varying vec2 vUv;float hh(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec3 c=texture2D(tScene,vUv).rgb;vec3 b=texture2D(tB1,vUv).rgb*.7+texture2D(tB2,vUv).rgb*.9;c+=b*bloom;vec2 q=vUv-.5;c*=1.-dot(q,q)*.8;c+=(hh(vUv*res)-.5)/255.;gl_FragColor=vec4(c,1.);}',{tScene:U(null),tB1:U(null),tB2:U(null),bloom:U(.75),res:U(new T.Vector2(1,1))});
    const pass=(m,t)=>{quad.material=m;renderer.setRenderTarget(t);renderer.render(qs,qc);};
    const sz=new T.Vector2();
    const o={
      resize(){renderer.getDrawingBufferSize(sz);const w=Math.max(2,sz.x|0),h=Math.max(2,sz.y|0);
        P.sc.setSize(w,h);P.a1.setSize(Math.max(2,w>>2),Math.max(2,h>>2));P.a2.setSize(Math.max(2,w>>2),Math.max(2,h>>2));P.c1.setSize(Math.max(2,w>>3),Math.max(2,h>>3));P.c2.setSize(Math.max(2,w>>3),Math.max(2,h>>3));
        mComp.uniforms.res.value.set(w,h);},
      render(){

function makeFloor(f){
  const lst=[];
  if(f%10===0){
    lst.push('boss');
    const n=Math.min(6,1+(f/10>>1)+(f>=50?1:0));
    for(let i=0;i<n;i++)lst.push(i%3===2?'drone':'grunt');
    if(f>=60)lst.push('heavy');
    if(f>=90)lst.push('heavy');
  }else if(f%5===0){
    const h=f>=50?2:1;
    for(let i=0;i<h;i++)lst.push('heavy');
    const g=Math.min(6,2+(f>>4));
    for(let i=0;i<g;i++)lst.push('grunt');
    for(let i=0;i<Math.min(3,1+(f>>5));i++)lst.push('drone');
  }else{
    let b=2.5+f*.55;const heavyMax=f>=3?Math.min(4,1+(f>>4)):0;let h=0;
    while(b>0&&lst.length<12){
      const r=Math.random();
      if(f>=3&&h<heavyMax&&b>=4&&r<.22){lst.push('heavy');h++;b-=4;}
      else if(f>=2&&r<.45&&b>=1.5){lst.push('drone');b-=1.5;}
      else{lst.push('grunt');b-=1;}
    }
  }
  const n=Math.max(1,Math.ceil(lst.length*.6));
  return [lst.slice(0,n),lst.slice(n)];
}

let camYaw=PI,camAuto=PI,camAdj=0,camDist=8,focus=null;
const camLook=new T.Vector3(0,1.7,5),_cp=new T.Vector3(),_lk=new T.Vector3();
const lockRing=new T.Mesh(new T.RingGeometry(.85,1,32),new T.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.85,side:T.DoubleSide,blending:T.AdditiveBlending,depthWrite:false}));
lockRing.rotation.x=-PI/2;lockRing.visible=false;scene.add(lockRing);
// Third-person chase camera: sits behind and slightly right of the player, low, and swings toward the nearest enemy.
function updateCamera(real){
  let best=null,bd=1e9;
  for(const e of enemies){if(e.dead||e.spawnT>.3)continue;const d=Math.hypot(e.x-P.x,e.z-P.z)-(e.type==='boss'?3:0);if(d<bd){bd=d;best=e;}}
  if(LK.t&&LK.t.dead)LK.t=null;
  if(LK.t){best=LK.t;bd=Math.hypot(best.x-P.x,best.z-P.z);}
  focus=best;
  const turn=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0)+gp.cam;
  camAdj=clamp(camAdj+turn*2.2*real,-1.7,1.7);if(!turn)camAdj*=Math.exp(-.7*real);
  let auto=P.f,rate=.9;
  if(best&&bd<(LK.t?46:30)){auto=Math.atan2(best.x-P.x,best.z-P.z);rate=2.6;}
  camAuto+=angDiff(auto,camAuto)*(1-Math.exp(-rate*real));
  camYaw=camAuto+camAdj;
  const asp=camera.aspect<1?1.5:1;
  const want=(7.2+clamp((best?bd:6)-5,0,12)*.5)*asp;
  camDist+=(want-camDist)*(1-Math.exp(-2*real));
  const fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=-fz,rz=fx;
  _cp.set(P.x-fx*camDist+rx*1.3,3.0+(camDist-7.2)*.3+P.y*.45,P.z-fz*camDist+rz*1.3);
  camera.position.lerp(_cp,1-Math.exp(-9*real));
  _lk.set(P.x+fx*3,1.7+P.y*.55,P.z+fz*3);
  if(best&&bd<(LK.t?46:30)){_lk.x+=(best.x-P.x)*.18;_lk.z+=(best.z-P.z)*.18;}
  camLook.lerp(_lk,1-Math.exp(-8*real));
  const sx=(Math.random()-.5)*shake*.6,sy=(Math.random()-.5)*shake*.6;
  camera.position.x+=sx;camera.position.y=Math.max(1,camera.position.y+sy);
  camera.lookAt(camLook);
  camera.position.x-=sx;camera.position.y-=sy;
  camera.fov=58+fovKick;camera.updateProjectionMatrix();
  if(best&&state==='play'){
    lockRing.visible=true;lockRing.position.set(best.x,.06,best.z);lockRing.scale.setScalar((best.r*1.5+.3)*(LK.t?1+Math.sin(tm*9)*.1:1));
    lockRing.material.color.setHex(best.type==='boss'?(best.broken>0?0xff2e88:best.exposed>0?0x27e6ff:0xffd23f):0xffd23f);
    if(LK.t)lockRing.material.color.setHex(0x9dff6a);
    lockMark.visible=!!LK.t;if(LK.t){lockMark.position.set(best.x,best.y+(best.type==='boss'?5.2:3.1),best.z);lockMark.rotation.y=tm*3;}
  }else{lockRing.visible=false;lockMark.visible=false;}
}
function animHair(real){
  const sp=Math.min(1.3,Math.hypot(P.vx,P.vz)/8.4);
  const fwd=P.vx*Math.sin(P.vf)+P.vz*Math.cos(P.vf),side=P.vx*Math.cos(P.vf)-P.vz*Math.sin(P.vf);
  if(CHR!==CH_H){CHR.hair(real,fwd,side,sp,P.vy);return;}
  const lift=P.vy>1?-.3:P.vy<-1?.25:0,k=1-Math.exp(-14*real),base=[.9,.35,.3,.28];
  PR.pony.forEach((j,i)=>{
    const tg=base[i]+Math.sin(tm*5-i)*(.07+i*.03)+(i===0?Math.max(0,fwd)*.05+lift:sp*(.15+i*.03));
    j.rotation.x+=(tg-j.rotation.x)*k;j.rotation.z+=((-side*.03)-j.rotation.z)*k;
  });
  PR.locks.forEach(l=>{const v=.03+.02*Math.sin(tm*3.1+l.ph)+.04*sp+(P.vy<-1?.05:0),tg=l.ax==='z'?l.s*v:-v;l.j.rotation[l.ax]+=(tg-l.j.rotation[l.ax])*k;});
  PR.ribbons.forEach((j,i)=>{j.rotation.x+=((.3+Math.max(0,fwd)*.06+Math.sin(tm*7+i)*.08)-j.rotation.x)*k;j.rotation.z+=(((i?1:-1)*.15-side*.02)-j.rotation.z)*k;});
}

/* ================= main loop ================= */
const clock={last:performance.now()};
let tm=0;
const SH={on:false,k:0,face:'base',n:0,was:false},SHOWKIND=['fan','sky','stretch'];
let blinkT=2.6,blinkOn=0,faceHold=0;
const _mz=new T.Vector3();
function calmNow(){for(const e of enemies){if(!e.dead&&Math.hypot(e.x-P.x,e.z-P.z)<11)return false;}return true;}
/* ---- character select: both leads stand on the stage, the chosen one performs ---- */
const SEL={i:0,ids:['hiiragi','sumire'],refresh:null};
function selectScene(real){
  blob.visible=false;
  for(let n=0;n<2;n++){
    const c=CHARS[SEL.ids[n]],on=n===SEL.i;useChar(c);c.root.visible=true;
    let p=c.idle(full(),real);
    if(on){const q=tm*.3,u=q%1,ks=c.showKinds;p=c.showPose(ks[Math.floor(q)%ks.length],u,p);c.setFace(c.showFace());}else c.setFace('base');
    applyBiped(c.rig,p,real,10);
    if(c===CH_H)animHair(real);else c.hair(real,0,0,0,0);
    c.root.position.set(n?1.9:-1.9,0,8);c.root.rotation.y=(n?-.22:.22)+(on?Math.sin(tm*.8)*.12:0);
    const sc=c.root.scale.x+((on?1.04:.94)-c.root.scale.x)*(1-Math.exp(-6*real));c.root.scale.setScalar(sc);
  }
  useChar(CHARS[SEL.ids[SEL.i]]);SH.fc='';
  camera.position.lerp(_cp.set(0,1.45,16.9),1-Math.exp(-5*real));camLook.lerp(_lk.set(0,.35,8),1-Math.exp(-5*real));
  camera.lookAt(camLook);camera.fov=44;camera.updateProjectionMatrix();
  lockRing.visible=true;lockRing.position.set(SEL.i?1.9:-1.9,.06,8);lockRing.scale.setScalar(1.25+Math.sin(tm*4)*.05);lockRing.material.color.setHex(SEL.i?0xd9a0ff:0x27e6ff);lockMark.visible=false;
}
function selConfirm(){const id=SEL.ids[SEL.i];store.set('nk_char',id);selectChar(id);startGame(1);}
function updateFace(real){
  P.smugT=Math.max(0,(P.smugT||0)-real);P.shockT=Math.max(0,(P.shockT||0)-real);
  let w='base',urgent=false;
  if(P.st==='dead'){w='dead';urgent=true;}
  else if(P.st==='hurt'){w='hurt';urgent=true;}
  else if(ST.on||P.st==='pose')w='mie';
  else if(SH.on)w=SH.face;
  else if(P.shockT>0)w='shock';
  else if(P.st==='atk'||P.st==='thrust'||P.st==='slam')w='shout';
  else if(P.st==='dodge')w='fight';
  else if(P.smugT>0)w='smug';
  else if(P.gunT>0||gunHeld())w='fight';
  else if(P.hp<P.max*.25)w='worry';
  else if(rankIdx>=5)w='sparkle';
  else if(rankIdx>=4)w='grin';
  blinkT-=real;if(blinkT<=0){blinkOn=.11;blinkT=2.2+Math.random()*3.2;}
  if(blinkOn>0){blinkOn-=real;if(w==='base'||w==='smug'||w==='worry'||w==='fight'||w==='grin')w='blink';}
  faceHold-=real;
  if(w!==SH.fc&&(urgent||faceHold<=0||w==='blink')){SH.fc=w;CHR.setFace(w);faceHold=.07;}
}
function computePlayerPose(dt){
  const sp=Math.min(1.3,Math.hypot(P.vx,P.vz)/8.4),grounded=P.y<=.001;
  let p,k=16;SH.on=false;
  if(P.st==='atk'&&P.cur){p=seqPose(CHR.frames(P.cur.id,P.swingDir),Math.min(1,P.t/P.cur.dur));k=28;}
  else if(P.st==='thrust'){p=seqPose(CHR.frames('thrust',1),Math.min(1,P.t/.36));k=30;}
  else if(P.st==='slam'){p=seqPose(CHR.frames('slam',1),Math.min(1,P.t/.5));k=30;}
  else if(P.st==='dodge'){p=full({bx:.75,rsx:.9,lsx:.9,rsz:.3,lsz:-.3,tx:.4,lh:1.0,rh:-.8,lk:.2,rk:1.2,hx:-.3,air:grounded?0:1});k=26;}
  else if(P.st==='hurt'){p=full({bx:-.45,rsx:.7,lsx:.7,rex:-.2,lex:-.2,tx:-.3,hx:.5,lh:.3,rh:-.2,lk:.5,rk:.4});k=30;}
  else if(P.st==='pose'){p=seqPose(CHR.frames('mie',1),Math.min(1,P.t/.9));k=18;SH.on=true;}
  else if(P.st==='dead'){p=full({bx:-1.4,rsz:.8,lsz:-.8,tx:-.2,lie:1});k=8;}
  else{
    p=full();
    if(!grounded){
      p.air=1;p.lh=P.vy>0?.3:.55;p.rh=-.15;p.lk=P.vy>0?.6:1.0;p.rk=.5;p.rsz=.55;p.lsz=-.55;p.rsx=-.2;p.lsx=-.2;p.tx=.1+clamp(-P.vy*.012,0,.25);
    }else{
      PR.phase+=dt*(4.2+sp*6.5)*(sp>.08?1:0);locoPose(p,PR.phase,sp);if(sp>.08)CHR.gait(p,sp);else CHR.idle(p,dt);
      if(P.landT>0){const q=P.landT/.18;p.lh=p.rh=.55*q;p.lk=p.rk=1.1*q;p.tx+=.2*q;}
      else if(P.jumpT>0){p.lh=-.2;p.rh=-.2;p.lk=.1;p.rk=.1;p.rsz=.4;p.lsz=-.4;}
    }
    P.idleT=(grounded&&sp<.08&&P.st==='free'&&!gunHeld())?(P.idleT||0)+dt:0;
    if(P.idleT>8){if(!P.idleMie){P.idleMie=true;sfx.tsuke();}p=seqPose(CHR.frames('mie',1),Math.min(.8,(P.idleT-8)/1.1));k=16;SH.on=true;SH.face='mie';}
    else{
      P.idleMie=false;
      if(state==='play'&&floorWait>.4&&P.st==='free'&&sp<.3){p=CHR.showPose('cheer',clamp((floorWait-.4)/1.8,0,1),p);SH.on=true;SH.face=CHR.showFace();k=14;}
      else if(P.idleT>2.2&&calmNow()){
        const n=(P.idleT-2.2)/3.2,idx=Math.floor(n),kind=CHR.showKinds[(SH.n+idx)%CHR.showKinds.length],u=n-idx;
        p=CHR.showPose(kind,u,p);SH.on=true;SH.face=CHR.showFace();SH.was=true;k=12;
        if(kind==='sky'){if(u<.4)SH.fired=false;else if(!SH.fired&&u>.5){SH.fired=true;muzzle.getWorldPosition(_mz);sfx.laser();burst(_mz.x,_mz.y+.2,_mz.z,0xffd23f,26,9,.14,.7,3);burst(_mz.x,_mz.y+.2,_mz.z,0xff2e88,16,6,.12,.6,3);}}
      }
    }
    if(P.idleT===0&&SH.was){SH.n++;SH.was=false;}
    if(P.gunT>0||gunHeld()){p.lsx=-1.5;p.lex=-.05;p.lsz=0;p.ty=-.3;p.hy=.2;}
  }
  return{p,k};
}
function frame(now){
  requestAnimationFrame(frame);
  const real=Math.min(.05,(now-clock.last)/1000);clock.last=now;tm+=real;
  pollPad();
  if(paused){drawScene();for(const k in Pr)Pr[k]=false;return;}
  if(slowT>0){slowT-=real;timeScale=.25;}else timeScale+=(1-timeScale)*Math.min(1,real*8);
  let dt=0;
  if(hitstop>0)hitstop-=real;else dt=real*timeScale;
  if(state==='play'||state==='dead'||state==='clearing'){
    updatePlayer(dt*(ST.on?1.25:1));
    for(const e of enemies)updateEnemy(e,dt);
    enemies=enemies.filter(e=>!e.gone);
    for(const p of projs){
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.mesh.position.set(p.x,p.y,p.z);
      if(Math.random()<.5)spark(p.x,p.y,p.z,p.friendly?0x27e6ff:0xff2e88,0,0,0,.12,.25,0);
      if(!p.friendly){
        if(Math.hypot(p.x-P.x,p.z-P.z)<.9&&Math.abs(p.y-(P.y+1.1))<1.3){hurtPlayer(p.dmg||8,p.x-p.vx,p.z-p.vz);if(P.st!=='dodge')p.life=0;}
      }else{
        for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.z-p.z)<e.r+.5&&Math.abs(p.y-(e.y+1.2))<2.4){damage(e,14,{id:'deflect',dx:Math.sign(p.vx),dz:Math.sign(p.vz),kb:3});p.life=0;break;}}
      }
    }
    projs=projs.filter(p=>{if(p.life<=0||Math.hypot(p.x,p.z)>40){scene.remove(p.mesh);return false;}return true;});
  }
  if(state==='play'){
    // floor flow
    if(spawnQ.length){spawnT-=dt;if(spawnT<=0){spawnEnemy(spawnQ.shift());spawnT=.35;}}
    const alive=enemies.filter(e=>!e.dead).length;
    if(!spawnQ.length&&groups.length&&alive<=1){spawnQ=groups.shift().slice();spawnT=.6;}
    else if(!spawnQ.length&&!groups.length&&alive===0){
      floorWait+=dt;
      if(floorWait>.01&&!state.clearing){
        if(floor>=FLOORS){state='clearing';slowT=1.2;score+=5000;store.set('nk_save',null);store.set('nk_super',true);sfx.ding();setTimeout(()=>{state='clear';showScreen('clear');},2200);}
        else if(floorWait>2.3){
          floorWait=0;floorReward();
        }
      }
    }else floorWait=0;
    lastHitT-=dt;comboT-=dt;if(comboT<=0)combo=0;
    if(PK.regen&&P.st!=='dead')P.hp=Math.min(P.max,P.hp+.8*PK.regen*dt);
    if(ST.on){if(!SUPER)ST.gauge-=7*pkDur()*dt;P.hp=Math.min(P.max,P.hp+3*dt);if(ST.gauge<=0&&!SUPER)endAwaken();}
    if(lastHitT<=0)hype=Math.max(0,hype-(6+hype*.08)*dt);
    comT-=dt;if(comT<=0){comT=Math.max(.35,1.7-hype*.014)+Math.random()*.4;comment('auto');}
    updateHud(dt);muUpdate(dt);
  }
  // fx (real time)
  for(const p of parts){if(!p.on)continue;p.life-=real;if(p.life<=0){p.on=false;p.m.visible=false;continue;}
    p.v.y-=p.g*real;p.m.position.addScaledVector(p.v,real);const k=p.life/p.max;p.m.scale.setScalar(p.size*(.3+k));p.m.material.opacity=k;}
  for(const s of slashes){if(!s.on)continue;s.t+=real;const u=s.t/s.life;if(u>=1){s.on=false;s.g.visible=false;continue;}
    s.g.position.set(P.x,P.y+1.2,P.z);s.g.rotation.y=s.base+(u-.5)*1.5*s.dir;s.g.scale.setScalar(s.sc*(.75+u*.4));s.m.material.opacity=(1-u)*.95;}
  for(const w of waves){if(!w.on)continue;w.t+=real;const u=w.t/w.life;if(u>=1){w.on=false;w.m.visible=false;continue;}w.m.scale.setScalar(w.r*(.2+u*.8));w.m.material.opacity=(1-u)*.85;}
  for(const t of tracers){if(!t.on)continue;t.t-=real;if(t.t<=0){t.on=false;t.m.visible=false;}}
  if(state==='select'){selectScene(real);}else{
  blob.visible=true;lockRing.visible=false;
  // player visuals (smoothed rig)
  const {p:pp,k:pk}=computePlayerPose(dt);
  applyBiped(PR,pp,dt,pk);animHair(real);awakenFx(real);updateFace(real);
  P.vf+=angDiff(P.f,P.vf)*Math.min(1,real*(P.st==='atk'||P.st==='thrust'?30:16));
  SH.k+=((SH.on?1:0)-SH.k)*Math.min(1,real*(SH.on?4.5:16));
  const camF=Math.atan2(camera.position.x-P.x,camera.position.z-P.z);
  pm.position.set(P.x,P.y,P.z);pm.rotation.y=P.vf+angDiff(camF,P.vf)*SH.k;
  blob.position.set(P.x,.03,P.z);blob.scale.setScalar(Math.max(.4,1-P.y*.15));
  pm.visible=!(P.inv>0&&P.st==='hurt'&&Math.floor(tm*30)%2===0);
  // cape (secondary motion from velocity)
  const fwd=P.vx*Math.sin(P.vf)+P.vz*Math.cos(P.vf),side=P.vx*Math.cos(P.vf)-P.vz*Math.sin(P.vf);
  if(CHR===CH_H){const pa=capeGeo.attributes.position,fs=Math.max(0,fwd)/8.4,ss=side/8.4;
  for(let i=0;i<pa.count;i++){const y=capeBase[i*3+1],k=(.78-y)/1.55;
    pa.setZ(i,capeBase[i*3+2]-k*(.12+fs*.7)+Math.sin(tm*9-k*5)*k*(.08+fs*.2)+(P.vy>1?-k*.15:P.vy<-1?k*.25:0));
    pa.setX(i,capeBase[i*3]-ss*k*.4);}
  pa.needsUpdate=true;}
  pm.updateMatrixWorld(true);
  const swinging=P.st==='atk'&&P.cur&&P.t>=Math.max(0,P.cur.hit-.09)&&P.t<P.cur.hit+.16,thr=P.st==='thrust'&&P.t<.3;
  trailCol3.setHex(ST.on?CHR.col.awk:(P.cur&&P.cur.launch?CHR.col.launch:CHR.col.slash));
  updateTrail(real,swinging||thr||P.st==='slam');
  if(state==='play'&&hype>40&&Math.random()<.5){const bx_=-Math.sin(P.vf)*.5,bz_=-Math.cos(P.vf)*.5;
    spark(P.x+bx_+rnd(-.5,.5),P.y+rnd(.8,2.2),P.z+bz_+rnd(-.5,.5),Math.random()<.5?0xff2e88:0x27e6ff,0,rnd(.2,1),0,.09,.7,0);}
  // camera
  shake=Math.max(0,shake-real*2.5);
  fovKick*=Math.max(0,1-real*7);
  updateCamera(real);
  }
  // theme tween
  const ta=1-Math.exp(-2.5*real);colA.lerp(tA,ta);colB.lerp(tB,ta);
  stageUpdate(real);
  drawScene();
  for(const k in Pr)Pr[k]=false;
}
camera.position.set(1.3,3.2,15.2);camLook.set(0,1.7,5);
setTheme(1);
selectChar(store.get('nk_char','hiiragi'));
showScreen('title');
requestAnimationFrame(frame);
window.__game={get CHR(){return CHR},selectChar,showScreen,SEL,camera,togglePause,P,get enemies(){return enemies},startGame,get state(){return state}};
})();
